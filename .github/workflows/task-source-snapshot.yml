name: task source snapshot

on:
  pull_request:
    paths: ['.github/workflows/task-source-snapshot.yml']

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.pull_request.number == 32 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/retire-ralph-native-goals'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare exact reviewed tree without updating any branch
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, tempfile, urllib.request, zlib
          from pathlib import Path
          expected_tree = '6d11834a2d65b201553e8be4be693d641867d778'
          encoded = ''
          items = json.loads(zlib.decompress(base64.b64decode(encoded)))
          task = Path(tempfile.mkdtemp(prefix='retirement-task-')) / 'worktree'
          subprocess.run(['git', 'worktree', 'add', '--detach', str(task), os.environ['EXPECTED_HEAD']], check=True)
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=task).decode().strip()
          def blob(data):
              return hashlib.sha1(('blob %d\0' % len(data)).encode() + data).hexdigest()
          assert git('rev-parse', 'HEAD') == os.environ['EXPECTED_HEAD']
          for item in items:
              path = task / item['path']
              assert not path.is_symlink() and path.is_file(), item['path']
              raw = path.read_bytes()
              assert blob(raw) == item['old'], item['path']
              if item['new'] is None:
                  path.unlink()
              else:
                  lines = raw.decode('utf-8').splitlines(keepends=True)
                  for start, end, replacement in reversed(item['edits']):
                      lines[start:end] = [replacement]
                  result = ''.join(lines).encode('utf-8')
                  assert blob(result) == item['new'], item['path']
                  path.write_bytes(result)
          (task / '.github/workflows/task-source-snapshot.yml').unlink()
          git('add', '-u')
          git('diff', '--cached', '--check')
          assert git('write-tree') == expected_tree
          api_root = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def post(endpoint, value):
              request = urllib.request.Request(api_root + endpoint, data=json.dumps(value).encode(), headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              }, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries = []
          for name in git('diff', '--cached', '--name-only').splitlines():
              path = task / name
              if path.exists():
                  mode = git('ls-files', '--stage', '--', ':(literal)' + name).split()[0]
                  sha = post('/git/blobs', {'content': base64.b64encode(path.read_bytes()).decode(), 'encoding': 'base64'})['sha']
                  assert sha == blob(path.read_bytes())
              else:
                  mode, sha = '100644', None
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': sha})
          tree = post('/git/trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries})['sha']
          assert tree == expected_tree
          commit = post('/git/commits', {'message': 'refactor!: retire ralph in favor of native goals', 'tree': tree, 'parents': [os.environ['EXPECTED_HEAD']]})['sha']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + commit + '\n')
          print(json.dumps({'prepared_commit': commit, 'tree': tree, 'refs_updated': False}))
          PY
      - name: Prepared commit ${{ steps.prepare.outputs.commit }}
        run: echo 'Verified commit objects prepared; no branch was updated.'
