name: task source snapshot

on:
  pull_request:
    paths: ['.github/workflows/task-source-snapshot.yml']

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/lean-scaffold-retire-four-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 35af802fcef4df88ecdcab8711b7dea9be1586e5
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare two immutable verified blobs without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'sean2077/skills'
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          assert git('rev-parse', 'HEAD') == '35af802fcef4df88ecdcab8711b7dea9be1586e5'
          path = Path('evals/tasks/cases.py')
          text = path.read_text()
          needle = '            commands = re.findall(r"`([^`\\n]+)`", guide)\n'
          assert text.count(needle) == 1
          path.write_text(text.replace(needle, needle + '            # Accept standalone command lines (including fenced/indented blocks),\n            # not only inline code. Formatting is not part of this project contract.\n            commands.extend(guide.splitlines())\n'))
          path = Path('scripts/tests/test_task_outcomes.py')
          text = path.read_text()
          needle = '        for relative in ("TESTING.md", "tests/placeholder.py", "tools/test.sh"):\n'
          assert text.count(needle) == 1
          addition = (
              '        for fence in ("```bash", "~~~sh"):\n'
              '            with self.subTest(command_format=fence):\n'
              '                command = "python -m unittest discover -s spec -p \'*_spec.py\'"\n'
              '                formatted = guide.replace("`" + command + "`", "\\n" + fence + "\\n" + command + "\\n" + fence[:3] + "\\n")\n'
              '                cases.write(workspace, "handbook/development.md", formatted)\n'
              '                self.assertTrue(*result())\n'
              '                cases.write(workspace, "handbook/development.md", formatted.replace("-s spec", "-s tests"))\n'
              '                self.assertFalse(result()[0])\n'
              '        cases.write(workspace, "handbook/development.md", guide)\n')
          path.write_text(text.replace(needle, addition + needle))
          paths = ['evals/tasks/cases.py', 'scripts/tests/test_task_outcomes.py']
          subprocess.run(['git', 'add', '--'] + paths, check=True)
          tree = git('write-tree')
          assert tree == 'd85acece8abbfcbc4ee5c85c2710d0cb6f5f6fb8', tree
          for name in paths:
              data = json.dumps({'encoding': 'base64', 'content': base64.b64encode(Path(name).read_bytes()).decode()}).encode()
              request = urllib.request.Request('https://api.github.com/repos/sean2077/skills/git/blobs', data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              assert result['sha'] == git('rev-parse', ':' + name), name
          print('Prepared two blobs for', tree)
          PY
