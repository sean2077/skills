name: task source snapshot

on:
  pull_request:
    paths: ['.github/workflows/task-source-snapshot.yml']

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.pull_request.number == 32 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/retire-ralph-native-goals'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare hash-verified objects without updating refs
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, textwrap
          source = subprocess.check_output(['git', 'show', 'b4ef926c03e5e3338253bf11da2692828a1326d9:.github/workflows/task-source-snapshot.yml']).decode()
          script = textwrap.dedent(source.split("          python - <<'PY'\n", 1)[1].split('\n          PY\n', 1)[0])
          # Correct three transport errors; every original/result blob and the
          # complete final tree must still match the reviewed local identities.
          script = script.replace('LPKBV1bVHL', 'LPKBV2bVHL')
          script = script.replace('CMR6SyJNC', 'CMR6yJNC')
          script = script.replace('Ft73uisbG1YrW', 'Ft73uisb7V01YrW')
          exec(compile(script, '<verified-retirement-preparation>', 'exec'))
          PY
      - name: Prepared commit ${{ steps.prepare.outputs.commit }}
        run: echo 'Verified commit objects prepared; no branch was updated.'
