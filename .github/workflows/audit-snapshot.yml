name: isolated-audit-snapshot
on:
  push:
    branches: [improve/harness-composition-20260906]
    paths: [.github/workflows/audit-snapshot.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reconstruct and verify the exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/improve/harness-composition-20260906
          git fetch --no-tags origin b5aa790953e9626ce6a0540747b293921ac8cc8f
          git worktree add --detach "$RUNNER_TEMP/final-audit" b5aa790953e9626ce6a0540747b293921ac8cc8f
          python - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path, PurePosixPath
          encoded = ''.join(Path(f'.github/audit-transfer/{i}.b64').read_text().strip() for i in range(3))
          Path(os.environ['RUNNER_TEMP'], 'audit-transport.txt').write_text(encoded)
          # Repair two identified text-transport transcription errors; the full
          # payload and final Git tree hashes below must still match exactly.
          encoded = ''.join(encoded.split())
          encoded = encoded.replace('8yPK42O42O42Gn5p', '8yPK42O42Gn5p', 1)
          encoded = encoded.replace('FWVU2ndzi', bytes.fromhex('46575655324e647a69').decode(), 1)
          assert hashlib.sha256(encoded.encode()).hexdigest() == '95310b20fc11123598e981d995ee94c719e85b60e295aa5715fc51f38460432b', 'transport checksum mismatch'
          records = json.loads(gzip.decompress(base64.b64decode(encoded, validate=True)))
          assert len(records) == 21
          root = Path(os.environ['RUNNER_TEMP'], 'final-audit')
          for name, record in records.items():
              relative = PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] not in ('.git', '.github')
              path = root / name
              assert not path.is_symlink()
              previous = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(previous).hexdigest() == record['sha256'], name
              lines = previous.decode('utf-8').splitlines(True)
              for start, end, replacement in reversed(record['edits']):
                  assert 0 <= start <= end <= len(lines), name
                  lines[start:end] = replacement.splitlines(True)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(''.join(lines).encode('utf-8'))
          PY
          final="$RUNNER_TEMP/final-audit"
          git -C "$final" add -A
          clean_tree="$(git -C "$final" write-tree)"
          test "$clean_tree" = 0a5fb91e01135eac58ccec1966a3b23212d99055
          printf 'Verified tested tree: %s\n' "$clean_tree"
          # Preserve the four transport files on this intermediate commit. The
          # connector removes them next, avoiding workflow-file writes by CI.
          for path in .github/workflows/audit-snapshot.yml .github/audit-transfer/{0,1,2}.b64; do
            blob="$(git rev-parse "$GITHUB_SHA:$path")"
            git -C "$final" update-index --add --cacheinfo "100644,$blob,$path"
          done
          tree="$(git -C "$final" write-tree)"
          test "$(git diff --name-only "$GITHUB_SHA" "$tree" | wc -l)" -eq 21
          test -z "$(git diff --name-only "$GITHUB_SHA" "$tree" -- .github)"
          commit="$(printf '%s\n' 'feat: strengthen skill composition and evidence-based evaluation' | git -c user.name=Sean -c user.email=37324769+sean2077@users.noreply.github.com commit-tree "$tree" -p "$GITHUB_SHA")"
          remote="$(git ls-remote origin refs/heads/improve/harness-composition-20260906 | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git push origin "$commit:refs/heads/improve/harness-composition-20260906"
          printf 'Published intermediate commit: %s\nTree: %s\n' "$commit" "$tree"
      - name: Retain transport bytes only when checksum verification fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-transport-diagnostic
          path: ${{ runner.temp }}/audit-transport.txt
          retention-days: 1
          if-no-files-found: ignore
