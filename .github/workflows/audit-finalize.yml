name: isolated-audit-finalization
on:
  push:
    branches: [improve/harness-composition-20260906]
    paths: [.github/workflows/audit-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply the tested baseline-validity correction and regenerate its private payload
        shell: bash
        env:
          AUDIT_DELTA: 
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/improve/harness-composition-20260906
          git fetch --no-tags origin 9efec2d2b5a121a2f046920f490e12ea206a9dbb
          git worktree add --detach "$RUNNER_TEMP/final-audit" 9efec2d2b5a121a2f046920f490e12ea206a9dbb
          python - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path, PurePosixPath
          encoded = os.environ['AUDIT_DELTA']
          assert hashlib.sha256(encoded.encode()).hexdigest() == '8864425f823f4f400732613b79b00b0afe22f701a673ad7acedb71d032bd34e6'
          records = json.loads(gzip.decompress(base64.b64decode(encoded, validate=True)))
          assert len(records) == 6
          root = Path(os.environ['RUNNER_TEMP'], 'final-audit')
          for name, record in records.items():
              relative = PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] not in ('.git', '.github')
              path = root / name
              assert not path.is_symlink()
              previous = path.read_bytes()
              assert hashlib.sha256(previous).hexdigest() == record['sha256'], name
              lines = previous.decode('utf-8').splitlines(True)
              for start, end, replacement in reversed(record['edits']):
                  assert 0 <= start <= end <= len(lines), name
                  lines[start:end] = replacement.splitlines(True)
              path.write_bytes(''.join(lines).encode('utf-8'))
          PY
          final="$RUNNER_TEMP/final-audit"
          (cd "$final" && python scripts/generate_p0_runtimes.py && python -m unittest -v scripts.tests.test_p0_agent_workflows scripts.tests.test_p0_hardening)
          git -C "$final" add -A
          test "$(git -C "$final" write-tree)" = fcca2b39c5db9fe00a4b97fa32d734edebbd3d75
          path=.github/workflows/audit-finalize.yml
          blob="$(git rev-parse "$GITHUB_SHA:$path")"
          git -C "$final" update-index --add --cacheinfo "100644,$blob,$path"
          tree="$(git -C "$final" write-tree)"
          test "$(git diff --name-only "$GITHUB_SHA" "$tree" | wc -l)" -eq 7
          test -z "$(git diff --name-only "$GITHUB_SHA" "$tree" -- .github)"
          commit="$(printf '%s\n' 'fix: require valid baseline execution for skill comparisons' | git -c user.name=Sean -c user.email=37324769+sean2077@users.noreply.github.com commit-tree "$tree" -p "$GITHUB_SHA")"
          test "$(git ls-remote origin refs/heads/improve/harness-composition-20260906 | cut -f1)" = "$GITHUB_SHA"
          git push origin "$commit:refs/heads/improve/harness-composition-20260906"
          printf 'Verified final tree: fcca2b39c5db9fe00a4b97fa32d734edebbd3d75\nPublished commit: %s\nStaged tree: %s\n' "$commit" "$tree"
