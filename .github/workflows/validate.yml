name: validate-skills

on:
  # Trunk pushes are the worktree flow's only origin writes. Branch pushes are
  # covered by pull_request; matching "**" here would run the full matrix twice
  # for every PR branch (Dependabot opens one per update).
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Supersede an in-flight run for the same ref, but never cancel a tag run:
# release.yml calls this workflow and deliberately sets cancel-in-progress: false.
#
# The prefix is a literal, NOT github.workflow: inside a called workflow that
# context resolves to the CALLER's name, so `${{ github.workflow }}-${{ github.ref }}`
# evaluated to release.yml's own `release-<ref>` group. The reusable call then
# queued behind its own caller, which never cancels, and the release deadlocked.
concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    name: validate (${{ matrix.os }})
    env:
      # Windows otherwise defaults Path.read_text() and redirected stdout to a
      # legacy code page, which breaks UTF-8 skill files and non-ASCII repo paths.
      PYTHONUTF8: "1"
      # Test imports must not add cache files to the skill payloads that the
      # installer smoke test compares byte-for-byte later in this job.
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # checkout must see the global value before it materializes tracked 120000 entries.
      - name: Enable native symlink checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.symlinks true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Assert platform shell and real checkout links
        env:
          EXPECTED_OS: ${{ runner.os }}
        run: |
          bash --version | head -1
          case "$EXPECTED_OS" in
            macOS)
              [[ ${BASH_VERSINFO[0]} -eq 3 ]]
              ;;
            Windows)
              case "$(uname -s)" in MINGW*|MSYS*) ;; *) exit 1 ;; esac
              git config --local core.symlinks true
              rm -f CLAUDE.md
              git checkout -- CLAUDE.md
              ;;
          esac
          test -L CLAUDE.md
          test "$(readlink CLAUDE.md)" = AGENTS.md

      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-validation.txt

      - name: Validate catalog rules
        run: |
          python scripts/catalog_health.py
          python scripts/test_catalog_health.py
          python scripts/validate_skills.py
          python scripts/test_validate_skills.py
          python scripts/tests/test_semver_release_plan.py
          python scripts/tests/test_scaffold_distribution.py
          python scripts/tests/test_private_skill_eval_contract.py
          python scripts/tests/test_live_skill_eval_adapter.py
          python scripts/tests/test_task_outcomes.py
          python scripts/tests/test_release_execution.py

      - name: Validate deterministic workflow and P0 runtimes
        run: |
          python scripts/generate_workflow_runtimes.py --check
          python scripts/generate_p0_runtimes.py --check
          python scripts/tests/test_workflow_runtimes.py
          python -m unittest -v scripts.tests.test_p0_agent_workflows
          python -m unittest -v scripts.tests.test_p0_hardening
          python .agents/skills/skill-eval/scripts/skill_eval.py validate evals/examples/offline/suite.json
          for suite in evals/agent-skills/*/suite.json; do
            python .agents/skills/skill-eval/scripts/skill_eval.py validate "$suite"
          done
          python .agents/skills/skill-eval/scripts/skill_eval.py run evals/examples/offline/suite.json --output "$RUNNER_TEMP/offline-skill-eval.json"
          python .agents/skills/skill-eval/scripts/skill_eval.py validate-result "$RUNNER_TEMP/offline-skill-eval.json"

      - name: Validate official Agent Skills specification
        run: |
          for skill in skills/*; do
            [[ -d "$skill" ]] && python -m skills_ref.cli validate "$skill"
          done
          python -m skills_ref.cli validate .agents/skills/skill-eval

      - name: Check agent-scaffold invariants
        if: ${{ !cancelled() }}
        run: |
          python scripts/tests/test_agent_scaffold_core.py
          python scripts/tests/test_workspace_entry.py
          python scripts/tests/test_project_conventions.py
          python scripts/tests/test_guidance_selection.py
          bash scripts/check-agent-scaffold.sh

      - name: E2E installer test with mandatory real links
        if: ${{ !cancelled() }}
        env:
          AGENT_SCAFFOLD_E2E_REQUIRE_SYMLINKS: "1"
        run: bash scripts/e2e-agent-scaffold.sh

      - name: Smoke-test real npx skills discovery
        if: ${{ !cancelled() }}
        run: |
          set +e
          output="$(NO_COLOR=1 DISABLE_TELEMETRY=1 npx --yes skills@1.5.17 add . -l 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            printf 'npx discovery command failed with status %s\n' "$status" >&2
            exit "$status"
          fi
          actual="$(printf '%s\n' "$output" | tr -d '\r' | sed -n 's/^.*    \([a-z0-9][a-z0-9-]*\)$/\1/p' | sort)"
          expected="$(python -c 'from pathlib import Path; print("\n".join(sorted(path.name for path in Path("skills").iterdir() if path.is_dir())))' | tr -d '\r')"
          if [ "$actual" != "$expected" ]; then
            printf 'npx discovery mismatch\nexpected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

      - name: Smoke-test installed skill payloads
        if: ${{ !cancelled() }}
        run: |
          repo="$(pwd)"
          source="$repo"
          case "$(uname -s)" in MINGW*|MSYS*) source="$(pwd -W)" ;; esac
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          git -C "$fixture" init -q
          (
            cd "$fixture"
            NO_COLOR=1 DISABLE_TELEMETRY=1 npx --yes skills@1.5.17 add "$source" -a codex -y
          )
          for source_skill in "$repo"/skills/*; do
            [ -d "$source_skill" ] || continue
            skill="$(basename "$source_skill")"
            installed_skill="$fixture/.agents/skills/$skill"
            test -d "$installed_skill"
            for payload in "$source_skill" "$installed_skill"; do
              unexpected="$(find "$payload" ! -type d ! -type f -print -quit)"
              if [ -n "$unexpected" ]; then
                printf '%s payload contains a symlink or special entry: %s\n' "$skill" "$unexpected" >&2
                exit 1
              fi
            done
            expected="$(cd "$source_skill" && find . -type f -print | sort)"
            actual="$(cd "$installed_skill" && find . -type f -print | sort)"
            if [ "$actual" != "$expected" ]; then
              printf '%s installed payload mismatch\nexpected:\n%s\nactual:\n%s\n' "$skill" "$expected" "$actual" >&2
              exit 1
            fi
            diff -ru "$source_skill" "$installed_skill"
          done

      - name: Shellcheck bundled scripts
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          find scripts skills -type f -name '*.sh' -print0 | xargs -0 shellcheck

  workflow-python38:
    name: workflow runtime (Python 3.8 floor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.8"

      - name: Validate generated runtimes and compatibility floor
        run: |
          python scripts/catalog_health.py
          python scripts/test_catalog_health.py
          python scripts/tests/test_live_skill_eval_adapter.py
          python scripts/generate_workflow_runtimes.py --check
          python scripts/generate_p0_runtimes.py --check
          python -m compileall -q \
            scripts/workflow_runtime scripts/p0_runtime \
            skills/deep-interview/scripts \
            skills/agent-scaffold/scripts \
            skills/agent-scaffold/assets/runtime \
            .agents/skills/skill-eval/scripts \
            evals/agent-skills evals/tasks
          python -m unittest -v \
            scripts.tests.test_workflow_runtimes.RuntimeTests.test_generated_runtimes_are_current_and_compile \
            scripts.tests.test_workflow_runtimes.RuntimeTests.test_read_only_discovery_has_no_filesystem_side_effects \
            scripts.tests.test_workflow_runtimes.RuntimeTests.test_approval_requires_unchanged_original_bytes_including_eol
          python -m unittest -v scripts.tests.test_p0_agent_workflows
          python -m unittest -v scripts.tests.test_p0_hardening
          # The release runtime is an installed scaffold asset, so it must run on the scaffold floor.
          python scripts/tests/test_semver_release_plan.py

      - name: Install and verify the scaffold on the Python 3.8 floor
        run: |
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          git -C "$fixture" init -q -b main
          git -C "$fixture" -c user.email=ci@example.invalid -c user.name=ci commit -q --allow-empty -m init
          (
            cd "$fixture"
            python -c 'import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 8) else 1)'
            bash "$GITHUB_WORKSPACE/skills/agent-scaffold/agent-scaffold.sh" plan --json > /dev/null
            bash "$GITHUB_WORKSPACE/skills/agent-scaffold/agent-scaffold.sh" apply --domains all
            bash "$GITHUB_WORKSPACE/skills/agent-scaffold/agent-scaffold.sh" doctor
            bash "$GITHUB_WORKSPACE/skills/agent-scaffold/agent-scaffold.sh" verify
            # The guard must block (exit 2); 127 or another failure would let hosts allow the edit.
            rc=0
            printf '{"tool_name":"Edit","tool_input":{"file_path":"%s/README.md"}}' "$PWD" \
              | python -X utf8 .agents/tools/hooks/hook-paths.py --guard 2> guard.err || rc=$?
            test "$rc" -eq 2 || { cat guard.err; exit 1; }
            grep -qF 'trunk_edit_guard: BLOCKED' guard.err
            python .agents/tools/generate-subagents.py --check
          )
